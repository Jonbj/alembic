# Deadline reminder config — one per line: id|due_date(YYYY-MM-DD)|message
#   id         short identifier (used to ack: scripts/ack_deadline.sh <id>)
#   due_date   first day the reminder fires (host local date, Europe/Rome)
#   message    text body (HTML allowed; keep on one line)
#
# Cron sends each entry once on its due_date, then every day until
# the operator acks (scripts/ack_deadline.sh <id>). At most once per day
# per id. Survives host downtime: if the host was off on the due date, the
# @reboot entry fires on the next boot and the daily entry resumes — the message
# is (re)sent until acknowledged. Bots cannot confirm delivery, so "received"
# is modelled as an explicit operator ack.
