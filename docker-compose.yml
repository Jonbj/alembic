# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: python scripts/run_with_durable_logs.py --service api -- uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
    ports: ["8001:8000"]
    volumes:
      - ./reports:/app/reports:ro
      - ${ALEMBIC_DURABLE_LOG_DIR:-./logs/containers}:/var/log/alembic
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    # General tasks: news ingestion, portfolio, execution, performance, etc.
    # --concurrency 4: enough for I/O-bound tasks, no LLM model loaded here.
    command: python scripts/run_with_durable_logs.py --service worker -- celery -A src.workers.celery_app worker --loglevel=info --concurrency 4 -Q celery --hostname=general@%h
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      SENTIMENT_REVERSAL_EXIT_THRESHOLD: "-0.35"
    volumes:
      - ${ALEMBIC_DURABLE_LOG_DIR:-./logs/containers}:/var/log/alembic
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker-inference:
    build: .
    # LLM/FinBERT tasks: sentiment, PEAD, regime. concurrency=1 → single process,
    # single FinBERT load (~500MB vs N×500MB with prefork).
    command: python scripts/run_with_durable_logs.py --service worker-inference -- celery -A src.workers.celery_app worker --loglevel=info --concurrency 1 -Q inference --hostname=inference@%h
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      SENTIMENT_REVERSAL_EXIT_THRESHOLD: "-0.35"
    volumes:
      - ${ALEMBIC_DURABLE_LOG_DIR:-./logs/containers}:/var/log/alembic
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  beat:
    build: .
    command: python scripts/run_with_durable_logs.py --service beat -- celery -A src.workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${ALEMBIC_DURABLE_LOG_DIR:-./logs/containers}:/var/log/alembic
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  backtest:
    build: .
    profiles: [backtest]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trading:trading@postgres:5432/trading
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      postgres: { condition: service_healthy }
    stdin_open: true
    tty: true

volumes:
  pgdata:
