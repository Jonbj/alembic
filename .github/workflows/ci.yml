name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Job 1: static analysis (no services needed, runs in parallel with test) ──
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by gitleaks for git-log scanning
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        # continue-on-error: true — ruff was never actually installed in CI until
        # now (uv sync --dev pulled from [dependency-groups], which didn't list it),
        # so this check has never run; the codebase has ~650 pre-existing violations
        # accumulated unseen. Informational until a dedicated lint-clean pass is
        # done. Remove continue-on-error after cleanup.
        continue-on-error: true
        run: uv run ruff check src/ tests/ --select E,F,W,I --ignore E501

      - name: Type check (mypy)
        # continue-on-error: true — mypy is informational until a dedicated
        # mypy-clean pass is done (P3). Remove continue-on-error after cleanup.
        continue-on-error: true
        run: uv run mypy src/ --config-file pyproject.toml

      - name: Dependency audit (pip-audit)
        # continue-on-error: true — torch/transformers have known CVEs that do
        # not affect our usage. Track in a separate issue; remove continue-on-error
        # after each CVE is either patched or explicitly accepted.
        continue-on-error: true
        run: uv run pip-audit --strict

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        # GITLEAKS_FAIL=false — verify no real secrets exist before enabling hard fail.
        # Remove and set GITLEAKS_FAIL=true once baseline is clean.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_FAIL: "false"

  # ── Job 2: full test suite with coverage ──
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trading:trading@localhost:5432/trading
      REDIS_URL: redis://localhost:6379/0
      ADMIN_API_KEY: test-api-key-for-ci-only-12345678
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $2b$12$i6qSOhZRTLWbWoSTukGsw.p2y0hEJEKmEqjHGwjuv3dXqB2Gy2WHO
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-not-for-prod
      JWT_EXPIRE_MINUTES: "60"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Apply database migrations
        # The postgres service starts empty; the project has no migration-tracking
        # table, so this replays migrations/*.sql in order (same script used for a
        # fresh local setup: scripts/apply_migrations.py).
        run: uv run python scripts/apply_migrations.py

      - name: Run tests with coverage
        # .coveragerc enforces fail_under=60; CI fails if coverage drops below threshold.
        # -x removed so all tests run and coverage is complete across all modules.
        run: |
          uv run pytest tests/ -q --tb=short \
            --cov=src \
            --cov-config=.coveragerc \
            --cov-report=term-missing
