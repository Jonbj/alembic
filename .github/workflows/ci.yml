name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trading:trading@localhost:5432/trading
      REDIS_URL: redis://localhost:6379/0
      ADMIN_API_KEY: test-api-key-for-ci-only-12345678
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $2b$12$i6qSOhZRTLWbWoSTukGsw.p2y0hEJEKmEqjHGwjuv3dXqB2Gy2WHO
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-not-for-prod
      JWT_EXPIRE_MINUTES: "60"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ --select E,F,W,I --ignore E501

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short -x
