apiVersion: 1

datasources:
  - name: AlembicPostgres
    type: grafana-postgresql-datasource
    uid: alembic-postgres
    url: postgres:5432
    database: trading
    user: trading
    secureJsonData:
      password: trading
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 10
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: true
    isDefault: true
