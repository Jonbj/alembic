server {
    listen 80;

    # No trailing slash on proxy_pass: the /api prefix is forwarded as-is to the backend,
    # matching all FastAPI routes registered under /api/...
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
