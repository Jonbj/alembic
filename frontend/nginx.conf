server {
    listen 80;

    # Docker's embedded DNS resolver. Putting the upstream host in a variable
    # (set $upstream_api) forces nginx to re-resolve `api` every `valid=` window
    # instead of caching the first IP for the whole worker lifetime. Without
    # this, when the `api` container is recreated (e.g. a rebuild) and gets a
    # new internal IP, nginx keeps proxying to the stale IP and the frontend
    # can't reach the backend until the frontend container is also restarted.
    resolver 127.0.0.11 valid=10s;

    # No trailing slash / no URI in proxy_pass: the /api prefix is forwarded
    # as-is to the backend, matching all FastAPI routes registered under /api/...
    location /api {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}