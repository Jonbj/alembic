# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "feedparser>=6.0",
    "bleach>=6.1",
    "transformers>=4.40",
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "yfinance>=0.2.38",
    "python-telegram-bot>=20.0",
    "httpx>=0.27",
    # v2 backtest dependencies
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "empyrical>=0.5.5",
    "alpaca-py>=0.43.4",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
