# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "feedparser>=6.0",
    "bleach>=6.1",
    "transformers>=4.40",
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "yfinance>=0.2.38",
    "python-telegram-bot>=20.0",
    "httpx>=0.27",
    # v2 backtest dependencies
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "empyrical>=0.5.5",
    "alpaca-py>=0.43.4",
    "pdfplumber>=0.11",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "firebase-admin>=7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
# Third-party packages (torch, transformers, alpaca-py, etc.) lack complete stubs.
# ignore_missing_imports prevents hundreds of stub-noise errors that drown real bugs.
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
strict = false
# Exclude generated/migration directories from type checking
exclude = ["migrations/", "quantconnect/", "reports/", "data/"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
    "pip-audit>=2.7",
]
