# Strategy allocation configuration — source of truth for StrategyRegistry.
#
# Semantics: allocation_pct is the fraction of total portfolio capital assigned
# to this strategy's sleeve. Weights produced by compute_target_weights() are
# sleeve-local (sum ≤ 1.0 within the sleeve); the orchestrator scales them by
# allocation_pct to obtain portfolio-level contributions.
#
# Invariants enforced at startup:
#   - sum(enabled allocation_pct) <= 1.0
#   - S4 allocation_pct <= 0.10 (research overlay, no dedicated gate report yet)
#   - S2 enabled requires explicit override (OOS gates not passed)

strategies:
  S1:
    enabled: true
    allocation_pct: 0.50
    mode: supervised_paper
    promotion_blocked: true
    note: >
      DEMOTED 2026-06-19 (P0-01). Backtest not valid: same-bar fill (t+0),
      survivorship bias, zero-cost assumption, circular stress/regime (hindsight),
      decorative walk-forward, DSR n_trials=1, no live stop-loss.
      Re-promotion requires P0-05/06/07 + P0-10/11 + P1-01/02/08/13 + positive SPA.
      Until then: paper observation only, no capital increase, no parameter tuning.

  S2:
    enabled: false
    allocation_pct: 0.00
    mode: research
    note: proxy implementation; OOS Sharpe -0.55, all gates failed — do not promote to live

  S3:
    enabled: false
    allocation_pct: 0.00
    mode: research
    note: excluded from live; gate 3/5 failed, possible sizing lookahead

  S4:
    enabled: true
    allocation_pct: 0.10
    mode: paper
    promotion_blocked: true
    note: >
      Tactical news overlay; capped at 10%. PROMOTION BLOCKED (P0-13): no gate report
      exists and IC>placebo has not been confirmed. Re-promotion to live requires
      P1-03 (gate fixes + SPA) + P1-04 (gate script runnable) + IC>placebo + 90-day paper.

